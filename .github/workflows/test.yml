name: Test

on:
  push:
    branches: ["main"]
    paths: ["install/**", ".github/workflows/test.yml"]
  pull_request:
    paths: ["install/**", ".github/workflows/test.yml"]
  workflow_dispatch:

jobs:
  test_local:
    name: Test local installation on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, macos-14, macos-15-intel, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Parse latest server release
        id: parse_server
        shell: bash
        run: |
          VERSION=$(cat ./server/package-lock.json | jq -r '.version')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Will test @scrypted/server@$VERSION"

      - name: Install scrypted server
        # setup-scrypted@v0.0.4, pinned by commit SHA.
        uses: scryptedapp/setup-scrypted@610bd31c99dd4f1ddc2ce1a43ef1bfdfcdae50cd
        with:
          # The action composes
          # https://raw.githubusercontent.com/{repo}/{branch}/install/local/...
          # so `repo` must be "owner/name" and `branch` a ref in that repo.
          # Point both at this fork, pinned to the exact commit being tested.
          repo: hulamanisrinish-cpu/scrypted-
          branch: ${{ github.event.pull_request.head.sha || github.sha }}
          version: ${{ steps.parse_server.outputs.version }}
