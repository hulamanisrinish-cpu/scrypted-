name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Node 22 LTS (latest patch). 22.12+ enables require() of synchronous ESM
  # modules by default, which prebuild-install (via node-abi) needs when
  # building native modules like @scrypted/node-pty.
  NODE_VERSION: 22

jobs:
  build-server:
    name: Build Server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Build server
        working-directory: server
        run: npm ci && npm run build

  build-common-and-sdk:
    name: Build Common + SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: sdk/package-lock.json

      # Order matters: common's tsc reaches into TS sources from sdk/dist
      # types, external/werift, server, and packages/auth-fetch, so every
      # one of those needs deps installed (and sdk built) before common
      # builds. Mirrors npm-install.sh.
      - name: Install server and auth-fetch dependencies
        run: |
          cd server && npm install
          cd ../packages/auth-fetch && npm install

      - name: Build SDK
        working-directory: sdk
        run: |
          npm ci
          npm run build

      - name: Install werift dependencies and debug types
        working-directory: external/werift
        run: |
          npm install
          # common type-checks werift sources with noImplicitAny; werift
          # itself doesn't ship debug's types, so hoist them here.
          npm install --no-save @types/debug@^4.1.12

      - name: Build common
        working-directory: common
        run: |
          npm install
          npm run build

  build-plugins:
    name: Build ${{ matrix.plugin }} plugin
    runs-on: ubuntu-latest
    needs: build-common-and-sdk
    strategy:
      fail-fast: false
      matrix:
        plugin: [homekit, prebuffer-mixin, mqtt, onvif]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: plugins/${{ matrix.plugin }}/package-lock.json

      # The SDK build output (sdk/dist) must exist before plugins can build:
      # their build scripts invoke sdk/bin/cli.js, which requires
      # ../dist/src/bin/scrypted-webpack.js. Plugin file: deps also point at
      # common and external/werift, so their deps must be installed too.
      - name: Build SDK
        working-directory: sdk
        run: |
          npm ci
          npm run build

      - name: Install common dependencies
        working-directory: common
        run: npm install

      - name: Install werift dependencies
        working-directory: external/werift
        run: npm install

      # homekit's webpack build compiles plugins/webrtc/src sources (deep
      # import of rtp-forwarders), so webrtc's node_modules (@scrypted/common,
      # @scrypted/server, @scrypted/sdk links) must exist. Mirrors
      # npm-install.sh, which installs webrtc + homekit together.
      - name: Install webrtc plugin dependencies
        if: matrix.plugin == 'homekit'
        working-directory: plugins/webrtc
        run: npm install

      # npm install, not npm ci: several plugin lockfiles are stale (they
      # record @scrypted/sdk@0.3.5 from an old repo layout, so npm ci links
      # bins that no longer exist -> "scrypted-webpack: not found").
      # Upstream's own build-plugins-changed.yml uses npm install too.
      - name: Build plugin
        working-directory: plugins/${{ matrix.plugin }}
        run: |
          npm install
          npm run build

  build-werift:
    name: Build werift (Node 24)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install and build werift
        working-directory: external/werift
        run: |
          npm install
          npm run build
